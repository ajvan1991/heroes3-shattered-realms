name: Crimson Static QA

on:
  push:
    branches: [main]
    paths:
      - "shattered-realms/**"
      - "tools/**"
      - "production/**"
      - ".github/workflows/crimson-static-qa.yml"
  pull_request:
    paths:
      - "shattered-realms/**"
      - "tools/**"
      - "production/**"
      - ".github/workflows/crimson-static-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile QA tooling
        run: python -m compileall -q tools
      - name: Validate Crimson staging
        run: python tools/validate_crimson_staging.py
      - name: Validate asset production contracts
        run: python tools/asset_pipeline.py
      - name: Validate every production batch selector
        shell: bash
        run: |
          for batch in A1 A2 A3 A4 A5 B1 B2 C1 C2; do
            python tools/asset_pipeline.py --batch "$batch" --report "production/asset-pipeline-$batch.latest.json"
          done
      - name: Build structural candidate
        run: python tools/build_crimson_candidate.py --allow-missing-assets
      - name: Verify structural candidate
        run: python tools/verify_crimson_candidate.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: crimson-static-qa-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            production/crimson-static-validation.latest.json
            build/crimson-v0.1-candidate/candidate-report.json
            build/crimson-v0.1-candidate/candidate-manifest.json
