name: Crimson Static QA

on:
  push:
    branches: [main]
    paths:
      - "shattered-realms/**"
      - "tools/**"
      - "production/**"
      - ".github/workflows/crimson-static-qa.yml"
  pull_request:
    paths:
      - "shattered-realms/**"
      - "tools/**"
      - "production/**"
      - ".github/workflows/crimson-static-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile QA tooling
        run: python -m compileall -q tools
      - name: Validate Crimson staging
        run: python tools/validate_crimson_staging.py
      - name: Validate committed reference closure
        run: python tools/validate_reference_closure.py
      - name: Validate runtime gate truth
        run: python tools/validate_runtime_gates.py
      - name: Validate runtime gate pre-build contract
        run: python tools/validate_runtime_gates.py --pre-build
      - name: Validate asset production contracts
        run: python tools/asset_pipeline.py
      - name: Validate every production batch selector
        shell: bash
        run: |
          for batch in A1 A2 A3 A4 A5 B1 B2 C1 C2; do
            python tools/asset_pipeline.py --batch "$batch" --report "production/asset-pipeline-$batch.latest.json"
          done
      - name: Assert asset contract invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("production/asset-pipeline.latest.json")
          r=json.loads(p.read_text())
          assert r["manifestAssets"] == 530, r
          assert r["batchCoverage"]["unownedBootSlice"] == 0, r["batchCoverage"]
          assert r["batchCoverage"]["priorityMismatches"] == 0, r["batchCoverage"]
          assert r["manifestErrors"] == [], r["manifestErrors"]
          print("Asset contract invariants PASS")
          PY
      - name: Build structural candidate
        run: python tools/build_crimson_candidate.py --allow-missing-assets
      - name: Verify structural candidate
        run: python tools/verify_crimson_candidate.py
      - name: Publish QA evidence summary
        if: always()
        shell: bash
        run: |
          echo "## Crimson Static QA #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- staging report: production/crimson-static-validation.latest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- runtime gates: production/runtime-gates.v0.1.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate report: build/crimson-v0.1-candidate/candidate-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate manifest: build/crimson-v0.1-candidate/candidate-manifest.json" >> "$GITHUB_STEP_SUMMARY"
